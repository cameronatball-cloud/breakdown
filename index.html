<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Breakdown</title>
<meta name="description" content="Back row training program and one-tap session tracker.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Breakdown">
<meta name="theme-color" content="#0A0C0B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one-column phone shell. Fixed header, scrolling middle, bottom tabs.
   A live session swaps the tabs for a floating rest bar. Full-screen interval timer on top. */
:root{
  /* Layout: rigid phone shell. Square-edged panels on near-black, one luminous green for action and done. */
  --bg:#0A0C0B; --surface:#111513; --surface2:#1A201C; --line:#29312C; --line2:#3A443E;
  --fg:#F2F5F1; --muted:#A2AEA6; --accent:#39FF7A; --accent-ink:#03140A;
  --good:#39FF7A; --good-bg:rgba(57,255,122,.12); --warn:#FF9F43; --warn-bg:rgba(255,159,67,.13);
  --accent-bg:rgba(57,255,122,.10);
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:6px; --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;-webkit-text-size-adjust:100%}
body{overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{font:inherit;color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:12px;width:100%;-webkit-user-select:text;user-select:text}
p{margin:0;line-height:1.45}
#app{height:100%;display:flex;flex-direction:column}
.top{flex:none;display:flex;align-items:center;gap:12px;padding:calc(var(--safe-t) + 12px) 16px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:18px 16px calc(112px + var(--safe-b));display:flex;flex-direction:column;gap:18px}
.grow{flex:1;min-width:0}
.eyebrow{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px}
.eyebrow::before{content:'';width:7px;height:7px;background:var(--accent);flex:none}
.h1{font-family:var(--display);font-weight:800;font-size:38px;line-height:.95;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.h2{font-family:var(--display);font-weight:800;font-size:23px;line-height:1;text-transform:uppercase;letter-spacing:.015em}
.h3{font-family:var(--display);font-weight:800;font-size:25px;line-height:1;letter-spacing:.015em;text-transform:uppercase}
.sub{color:var(--muted);margin-top:4px}
.muted{color:var(--muted)} .small{font-size:14px;line-height:1.45}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-top:2px solid var(--line2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between} .end{justify-content:flex-end}
.btn{font-family:var(--display);font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;text-decoration:none;min-height:50px;border-radius:6px;padding:0 18px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.sm{font-size:16px;min-height:40px;padding:0 14px;border-radius:6px;font-size:14px}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:var(--surface2)}
.btn-ghost.on{background:var(--accent);color:var(--accent-ink)}
.wide{width:100%}
.chip{font-family:var(--body);font-weight:650;min-height:40px;padding:0 13px;border:1px solid var(--line);border-radius:4px;background:var(--surface2);font-size:15px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.done{background:var(--good-bg);color:var(--good)}
.pill{font-size:12px;font-weight:650;padding:4px 9px;border-radius:4px;background:var(--surface2);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.acc{background:var(--accent-bg);color:var(--accent)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg .chip{justify-content:center}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:10px 12px;font-size:14px;line-height:1.4}
.ic{width:20px;height:20px;flex:none} .ic.sm{width:16px;height:16px}
.iconbtn{width:40px;height:40px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface2);flex:none}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;font-weight:600;color:var(--muted);text-align:center}
.tab .ic{width:23px;height:23px}
.tab{font-family:var(--display);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.tab[aria-current="page"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
/* week strip */
.strip{display:grid;grid-template-columns:repeat(15,1fr);gap:3px}
.wk{height:12px;border-radius:3px;background:var(--surface2)}
.wk.past{background:var(--muted);opacity:.55} .wk.cur{background:var(--accent)} .wk.dl:not(.cur):not(.past){background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.strip-l{display:grid;grid-template-columns:7fr 4fr 4fr;font-family:var(--display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.strip-l span:nth-child(3){text-align:right}
/* next card */
.next .h1{font-size:44px}
.preview{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.preview li{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.preview li span:first-child{min-width:0;font-weight:650}
.preview li span:last-child{text-align:right;flex:none;max-width:50%}
.resume{background:var(--accent-bg);border-color:var(--accent);text-align:left}
/* bodyweight */
.bwrow{display:grid;grid-template-columns:52px 1fr 52px auto;gap:8px;align-items:center}
.step{height:52px;min-width:52px;border-radius:6px;background:var(--surface2);font-size:20px;font-weight:600;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.bwval{height:52px;border-radius:6px;background:var(--surface2);font-family:var(--display);font-size:30px;font-weight:700;display:flex;align-items:baseline;justify-content:center;gap:4px;padding-top:8px}
.bwval small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.macros div{background:var(--surface2);border-radius:6px;padding:10px 6px;text-align:center}
.macros b{display:block;font-family:var(--display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.macros small{font-size:11px;color:var(--muted)}
/* session */
.group{background:var(--surface);border:1px solid var(--line);border-top:2px solid var(--line2);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:14px}
.group-l{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--accent)}
.group .item + .item{border-top:1px solid var(--line);padding-top:14px}
.item{display:flex;flex-direction:column;gap:10px}
.item.warm{flex-direction:row;align-items:center;gap:12px}
.item.is-done .exname,.item.is-done .h3{color:var(--good)}
.exhead{display:flex;gap:10px;align-items:flex-start}
.tag{font-family:var(--display);font-weight:700;font-size:16px;min-width:34px;height:28px;padding:0 6px;border-radius:6px;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:none;margin-top:1px}
.exname{font-family:var(--display);font-weight:800;font-size:25px;letter-spacing:.015em;text-transform:uppercase;display:inline-flex;gap:6px;align-items:center;line-height:1.05;color:var(--fg)}
.exname .ic{color:var(--muted)}
.presc{color:var(--muted);font-size:13.5px;margin-top:3px;line-height:1.35}
.note{font-size:13px;color:var(--muted)}
.target{font-size:14px;color:var(--accent);font-weight:600}
.mem{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:3px 12px;margin-top:5px;line-height:1.35}
.mem b{color:var(--fg);font-weight:600}
.notepin{background:var(--accent-bg);color:var(--accent);border-radius:6px;padding:9px 12px;font-size:14px;font-weight:600;width:100%;text-align:left;line-height:1.35}
.coach{display:flex;flex-direction:column;gap:12px}
.ins{display:flex;gap:10px;align-items:flex-start}
.ins .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none;background:var(--accent)}
.ins.good .dot{background:var(--good)} .ins.warn .dot{background:var(--warn)}
.ins b{display:block;font-size:15px;line-height:1.3} .ins p{font-size:13.5px;color:var(--muted);margin-top:2px}
.changes li small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.sets{display:flex;flex-direction:column;gap:8px}
.setrow{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) 58px;gap:8px;align-items:center}
.si{font-family:var(--display);font-size:15px;font-weight:800;color:var(--muted);text-align:center;text-transform:uppercase}
.val{height:54px;border-radius:6px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:0 6px;min-width:0;text-align:center}
.val span{font-family:var(--display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.val small{font-size:10.5px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.val.span2{grid-column:span 2}
.val.big{height:64px;min-width:120px;flex:1}
.val.big span{font-size:34px}
.val.dim span{color:var(--muted)}
.tick{height:54px;width:58px;border-radius:6px;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.tick .ic{width:26px;height:26px}
.tick.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.setrow.done .val{background:var(--good-bg)} .setrow.done .val span{color:var(--good)}
.exfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.effort{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.effort .eyebrow{margin-right:2px}
.reps{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.rep{height:54px;border-radius:6px;background:var(--surface2);font-family:var(--display);font-size:22px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:4px}
.rep.on{background:var(--accent);color:var(--accent-ink)}
.elapsed{font-family:var(--display);font-size:20px;font-weight:600;color:var(--muted)}
/* rest bar */
.restbar{position:fixed;left:12px;right:12px;bottom:calc(12px + var(--safe-b));z-index:9;background:var(--fg);color:var(--bg);border-radius:6px;padding:10px 10px 14px 16px;display:grid;grid-template-columns:1fr auto auto auto;grid-template-areas:"l l l l" "t a b c";column-gap:8px;row-gap:4px;align-items:center;box-shadow:0 12px 34px rgba(0,0,0,.35);overflow:hidden}
.restbar .rt{grid-area:t} .restbar .rl{grid-area:l} .restbar button:nth-of-type(1){grid-area:a} .restbar button:nth-of-type(2){grid-area:b} .restbar button:nth-of-type(3){grid-area:c}
.restbar .rt{font-family:var(--display);font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;min-width:86px;line-height:1}
.restbar .rl{flex:1;min-width:0;font-size:13px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.restbar .rl b{font-size:11px;text-transform:uppercase;letter-spacing:.07em;opacity:.65;margin-right:6px}
.restbar button{height:44px;min-width:52px;padding:0 10px;border-radius:6px;background:rgba(128,128,128,.2);font-weight:650;font-size:14px;text-align:center}
.restbar .rp{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);transition:width .25s linear}
.restbar.go{background:var(--accent);color:var(--accent-ink)}
.restbar.go .rp{background:var(--accent-ink)}
/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:flex-end}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:8px 8px 0 0;padding:18px 16px calc(18px + var(--safe-b));display:flex;flex-direction:column;gap:14px;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
.sh-title{font-family:var(--display);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.015em}
.stepper{display:grid;grid-template-columns:repeat(2,minmax(48px,60px)) minmax(0,1fr) repeat(2,minmax(48px,60px));gap:8px;align-items:center}
.stepper .step{font-size:15px}
.bigval{height:72px;border-radius:6px;background:var(--surface2);font-family:var(--display);font-size:42px;font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;width:100%;text-align:center}
input.bigval{border:2px solid var(--accent);padding:0}
.plates{text-align:center;color:var(--muted);font-size:14px}
.check{display:flex;gap:10px;align-items:center;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.list{display:flex;flex-direction:column;gap:6px}
.list button{min-height:54px;padding:8px 14px;border-radius:6px;background:var(--surface2);display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:550}
.list button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:var(--surface2);border-radius:6px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:24px;font-weight:700}
.stat small{font-size:11px;color:var(--muted)}
.changes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.changes li{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:8px 10px;border-radius:6px;background:var(--good-bg)}
.changes li b{color:var(--good);font-variant-numeric:tabular-nums}
/* timer */
.timer{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;gap:10px;padding:calc(var(--safe-t) + 16px) 20px calc(var(--safe-b) + 20px);background:var(--bg);color:var(--fg)}
.timer.w{background:var(--accent);color:var(--accent-ink)}
.timer.r{background:var(--surface2);color:var(--fg)}
.timer .iconbtn{background:rgba(128,128,128,.22)}
.trow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tname{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.06em}
.tbody{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;text-align:center}
.tlabel{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(28px,9vw,46px);line-height:1.05;text-wrap:balance}
.count{font-family:var(--display);font-weight:800;font-size:clamp(120px,46vw,260px);line-height:.85;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tmeta{font-size:16px;font-weight:600;opacity:.8}
.tnext{font-size:15px;opacity:.75}
.tctl{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px}
.timer .btn-ghost{background:rgba(128,128,128,.22)}
.timer.w .btn-primary{background:var(--accent-ink);color:var(--accent)}
/* progress */
.maxes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.maxes .card{gap:4px;padding:14px}
.maxes b{font-family:var(--display);font-size:36px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chartbox{position:relative;touch-action:pan-y}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .goal{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.chart text.goalt{fill:var(--muted);font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.chart text.endt{fill:var(--fg);font-family:var(--display);font-weight:800;font-size:16px}
.chart .xh{stroke:var(--fg);stroke-width:1;opacity:.5}
.chart .xhd{fill:var(--accent);stroke:var(--bg);stroke-width:2}
.tip{position:absolute;transform:translate(-50%,-100%);background:var(--fg);color:var(--bg);padding:6px 9px;border-radius:4px;font-size:12px;pointer-events:none;white-space:nowrap;text-align:center;z-index:2}
.tip b{display:block;font-family:var(--display);font-size:18px;font-weight:800}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:14px;height:3px;background:var(--accent);vertical-align:middle;margin-right:6px}
.gbar{position:relative;height:12px;background:var(--surface2);border-radius:3px;overflow:visible}
.gfill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px;box-shadow:0 0 8px rgba(57,255,122,.35)}
.gexp{position:absolute;top:-4px;width:3px;height:20px;background:var(--fg);transform:translateX(-50%);border-radius:1px}
.gcyc{position:absolute;top:-4px;width:9px;height:20px;border:2px solid var(--accent);transform:translateX(-50%);border-radius:2px}
.goal .gname{font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.gnow{font-family:var(--display);font-weight:800;font-size:30px;line-height:1}
.legend i.tk{width:3px;height:14px;background:var(--fg)} .legend i.tk.o{width:8px;height:14px;background:none;border:2px solid var(--accent)}
.legend{flex-wrap:wrap}
.chip.wkc .ic{color:var(--accent)} .chip.wkc[aria-pressed="true"] .ic{color:var(--accent-ink)}
.legend i.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);opacity:.7}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;filter:drop-shadow(0 0 4px rgba(57,255,122,.45));stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:rgba(57,255,122,.08)}
.chart .dt{fill:var(--muted);opacity:.55}
.chart .end{fill:var(--accent)}
.chart .gr{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.tablewrap{overflow-x:auto;margin:0 -2px}
.wklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.wkrow{display:flex;gap:12px;padding:10px 8px;border-bottom:1px solid var(--line);border-radius:6px}
.wkrow.cur{background:var(--accent-bg)}
.wkrow .wkn{font-family:var(--display);font-size:26px;font-weight:700;width:30px;text-align:center;line-height:1;padding-top:2px;color:var(--muted)}
.wkrow.cur .wkn{color:var(--accent)}
.wkrow .grow{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.wkrow b{font-size:15px;color:var(--fg)}
.list .tl{display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0}
.list .tl small{font-size:12px;font-weight:500}
.list .tr{display:flex;align-items:center;gap:8px;flex:none}
.list .tr b{font-family:var(--display);font-size:20px}
.tbl{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}

@media (prefers-reduced-motion: reduce){.sheet{animation:none}.restbar .rp{transition:none}}
@media (min-width:640px){.main,.top{padding-left:max(16px,calc(50% - 300px));padding-right:max(16px,calc(50% - 300px))}.restbar{left:max(12px,calc(50% - 300px));right:max(12px,calc(50% - 300px))}}
</style>

<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<noscript><p style="padding:24px">Breakdown needs JavaScript turned on.</p></noscript>
<script>
'use strict';
/* =========================================================
   Breakdown: back row program + session tracker
   Data lives in localStorage on this device only.
   ========================================================= */
const KEY = 'breakdown:v2';
try { localStorage.removeItem('breakdown:v1'); } catch (e) {}
const $ = s => document.querySelector(s);
const z2 = n => String(n).padStart(2, '0');
const dstr = d => d.getFullYear() + '-' + z2(d.getMonth() + 1) + '-' + z2(d.getDate());
const today = () => dstr(new Date());
const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00') - new Date(a + 'T12:00')) / 864e5);
const r25 = x => Math.round(x / 2.5) * 2.5;
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtW = x => x == null ? '–' : String(Math.round(x * 100) / 100);
function fmtT(sec) { if (sec == null || isNaN(sec)) return '–'; sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return h ? h + ':' + z2(m) + ':' + z2(s) : m + ':' + z2(s); }
function fmtPace(sec) { const m = Math.floor(sec / 60), s = sec - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1); }
const fmtRest = s => !s ? 'none' : s < 60 ? s + ' s' : (s % 60 ? fmtT(s) : (s / 60) + ' min');
const restTxt = s => s ? 'rest ' + fmtRest(s) : 'straight into the next one';
const fmtClock = t => { const d = new Date(t); return z2(d.getHours()) + ':' + z2(d.getMinutes()); };
const fmtDate = d => new Date(d + 'T12:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });

/* ---------- icons ---------- */
const ICON = {
  home: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
  chart: '<path d="M4 20V11M10 20V5M16 20v-6M2 20h20"/>',
  book: '<path d="M5 4h9a4 4 0 014 4v12H9a4 4 0 01-4-4z"/><path d="M9 4v12"/>',
  cog: '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  swap: '<path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/>',
  play: '<path d="M7 5l12 7-12 7z" fill="currentColor"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  timer: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/>',
  target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/>'
};
const ic = (n, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

/* ---------- state ---------- */
function defState() {
  const d = today();
  return {
    v: 1, onboarded: false, cycleBegan: null, cycleStart: null,
    settings: { mode: 'off', week: 1, cycle: 1, bar: 20, trapBar: 25, sound: true, adjLift: 0, adjRest: 0 },
    e1rm: { squat: 120, bench: 105, trap: 160, chin: 115 },
    e1rmEst: { squat: false, bench: false, trap: true, chin: true },
    hist: { squat: [{ d, v: 120 }], bench: [{ d, v: 105 }], trap: [], chin: [] },
    tests: {}, bw: [], sessions: [], active: null, last: {}, swaps: {}, checkins: [],
    liftLog: {}, lastHist: {}, best: {}, restAdj: {}, notes: {}
  };
}
function hydrate(o) {
  const d = defState();
  return { ...d, ...o, onboarded: o.onboarded ?? true, settings: { ...d.settings, ...(o.settings || {}) }, e1rm: { ...d.e1rm, ...(o.e1rm || {}) },
    e1rmEst: { ...d.e1rmEst, ...(o.e1rmEst || {}) }, hist: { ...d.hist, ...(o.hist || {}) } };
}
let S;
const dropOld = o => { delete o.rest; return o; };
try { const raw = localStorage.getItem(KEY); if (raw) { const o = JSON.parse(raw); if (o && o.v === 1) { S = hydrate(dropOld(o)); S.settings.week = Math.min(TOTALW, S.settings.week); if (!S.cycleBegan) S.cycleBegan = (S.bw[0] && S.bw[0].d) || today(); } } } catch (e) {}
if (!S) S = defState();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Could not save on this phone. Storage may be full.'); } }
const ui = { tab: 'today', view: S.active ? 'session' : 'tabs', pick: null, feel: 'normal', sheet: null, timer: null, sw: null, bwDraft: null, dayType: null, pSid: 'D1', pWeek: null };

/* ---------- tests ---------- */
const TESTS = {
  cmj:    { name: 'Countermovement jump', unit: 'cm', step: 1, big: 5, def: 40, up: true, goal: 45, goalTxt: '45–50 cm', note: 'Best of 3, hands on hips. Film in slow motion with the My Jump app.' },
  broad:  { name: 'Standing broad jump', unit: 'cm', step: 1, big: 10, def: 230, up: true, goal: 250, goalTxt: '250 cm', note: 'Two feet, measure to the back of the heels. Best of 3.' },
  peakw:  { name: 'Assault bike 10 s peak watts', unit: 'W', step: 10, big: 50, def: 800, up: true, goal: 1000, goalTxt: '1,000 W', note: 'Best peak watts from three 10-second sprints.' },
  bike3:  { name: 'Assault bike 3 min max calories', unit: 'cal', step: 1, big: 5, def: 60, up: true, goal: 80, goalTxt: '80 cal', note: 'All-out for 3 minutes on the assault bike.' },
  ski2k:  { name: '2 km ski erg', unit: 'time', step: 1, big: 10, def: 470, up: false, goal: 435, goalTxt: 'under 7:15', note: 'Damper 5 to 7. All-out but evenly paced.' },
  s10:    { name: '10 m sprint', unit: 's', step: .01, big: .1, def: 1.85, up: false, goal: 1.75, goalTxt: 'under 1.75 s', note: 'Best of 3, 3 min between. Timing app or a mate with a stopwatch.' },
  s40:    { name: '40 m sprint', unit: 's', step: .01, big: .1, def: 5.6, up: false, goal: 5.3, goalTxt: 'under 5.30 s', note: 'Best of 3, 3 min between.' },
  bronco: { name: 'Bronco', unit: 'time', step: 1, big: 10, def: 315, up: false, goal: 290, goalTxt: 'under 4:50', note: 'Cones at 0, 20, 40 and 60 m. Out and back to 20, 40, then 60 m. Five times without stopping, 1200 m in total.' }
};
const unitLabel = u => ({ cm: 'cm', W: 'watts', cal: 'calories', time: 'min:sec', s: 'seconds' }[u] || u);
function fmtTest(k, v) { if (v == null) return '–'; const u = TESTS[k].unit; return u === 'time' ? fmtT(v) : u === 's' ? v.toFixed(2) : String(Math.round(v)); }
function latest(k) { const a = S.tests[k]; return a && a.length ? a[a.length - 1].v : null; }
function curBW() { if (!S.bw.length) return 84; return [...S.bw].sort((a, b) => a.d < b.d ? -1 : 1).pop().kg; }
const mas = () => { const b = latest('bronco'); return b ? 1200 / (b - 20.3) : 4.0; };
const skiPace = () => { const t = latest('ski2k'); return t ? t / 4 : null; };
const bikeRate = () => { const c = latest('bike3'); return c ? c / 3 : null; };

/* ---------- program ---------- */
const TOTALW = 15;
const BLK = w => w <= 7 ? 'b' : w <= 11 ? 's' : 'p';
const BLKN = { b: 'Build', s: 'Strength', p: 'Power' };
const PHASES = [{ k: 'b', name: 'Build', from: 1, to: 7 }, { k: 's', name: 'Strength', from: 8, to: 11 }, { k: 'p', name: 'Power', from: 12, to: 15 }];
const isDL = w => w === 7 || w === 11;
const isTW = w => w === 1 || w === TOTALW;
const weekName = w => isTW(w) ? 'Test week' : isDL(w) ? 'Recovery week' : BLKN[BLK(w)] + ' phase';
// Build is now five hard weeks (2-6): volume first, then heavier. Strength and Power follow.
const MAIN = {
  2: [[4, 8, .70]], 3: [[4, 8, .725]], 4: [[4, 6, .75]], 5: [[4, 6, .775]], 6: [[5, 5, .80]], 7: [[3, 5, .70]],
  8: [[1, 3, .85, 'top'], [3, 5, .78]], 9: [[1, 3, .875, 'top'], [3, 5, .80]], 10: [[1, 3, .90, 'top'], [3, 5, .82]], 11: [[3, 3, .75]],
  12: [[1, 2, .90, 'top'], [3, 3, .80, 'con']], 13: [[1, 1, .93, 'top'], [3, 3, .82, 'con']], 14: [[1, 1, .95, 'top'], [3, 2, .85]]
};
function scheme(lift, w) {
  if (w === 1) return { test: 5 };
  if (w === TOTALW) return { test: 3 };
  if (lift === 'trap') {
    if (w === 7) return [[3, 5, .65]];
    if (w === 11) return [[3, 3, .70]];
    const b = BLK(w);
    return b === 'b' ? (w <= 3 ? [[4, 8, .65]] : [[4, 6, .70]]) : b === 's' ? [[1, 3, .85, 'top'], [3, 5, .75]] : [[1, 2, .90, 'top'], [4, 3, .65, 'spd']];
  }
  return MAIN[w];
}
// Rest by aim. Heavy, low-rep sets need the longest for strength to come back; moderate sets
// for size need less; fast speed sets need just enough to stay fast. Your own adjustment is added on top.
function mainRest(tag, p) {
  if (tag === 'test' || tag === 'top' || tag === 'con') return 240;
  if (tag === 'spd') return 120;
  return p >= .85 ? 210 : p >= .75 ? 180 : 150;
}
const LIFTS = {
  squat: { name: 'Back squat', eq: 'bb', inc: 5, rest: 210, alts: ['Safety bar squat', 'Hack squat'], con: 'Contrast: after each back-off set, rest 4 min, then 3 box jumps.' },
  bench: { name: 'Bench press', eq: 'bb', inc: 2.5, rest: 210, alts: ['DB bench press', 'Floor press'], con: 'Contrast: after each back-off set, rest 3 min, then 5 plyo push-ups.' },
  trap:  { name: 'Trap bar deadlift', eq: 'trap', inc: 5, rest: 210, alts: ['Conventional deadlift'] },
  chin:  { name: 'Weighted chin-up', eq: 'add', inc: 2.5, rest: 180, alts: ['Neutral-grip pull-up', 'Lat pulldown'] }
};
const W = text => ({ k: 'warm', text });
const T = key => ({ k: 'test', key });
const M = (g, lift) => ({ k: 'main', g, lift });
const A = (g, id, name, o = {}) => ({ k: 'acc', g, id, name, ...o });
const P = (g, id, name, o = {}) => ({ k: 'power', g, id, name, ...o });
const R = (g, id, name, o = {}) => ({ k: 'rep', g, id, name, ...o });
const C = fn => ({ k: 'cond', fn });
const NECK = g => A(g, 'neck', 'Neck isometrics', { unit: 's', all: [2, 15, 15], rest: 75, note: '15 s each way: front, back, left, right. Hand, towel or harness. Max effort, no movement.' });
const WARM_GYM = '3 min easy bike or ski. Then 90/90 hip switches ×8, couch stretch 30 s each side, band lateral walks ×15 each way, 10 scap push-ups and 15 band pull-aparts. Finish with 2 or 3 lighter sets of the first big lift.';
const WARM_LOWER = WARM_GYM + ' Add pogo hops, 2 × 15.';

function bikeSprints(ctx, n) {
  const pw = latest('peakw');
  return { name: 'Assault bike sprints', desc: `${n} × 10 s all-out, 50 s easy. Standing start each rep.`, target: 'Keep every rep within 10% of your best' + (pw ? ` (${Math.round(pw * .9)} W or more)` : ' peak watts'), plan: { rounds: n, segs: [['All-out', 10, 'w'], ['Easy', 50, 'r']] } };
}
const easy = (nm, min) => ({ name: nm.replace('Easy bike', 'Easy assault bike'), desc: `${min} min easy. You should be able to talk in sentences.`, plan: { segs: [['Easy', min * 60, 'r']] } });
function skiZ2() { const p = skiPace(); return p ? `${fmtPace(p + 18)} to ${fmtPace(p + 25)} per 500 m` : 'Easy, conversational. Your paces appear after the 2 km ski test.'; }
function ski30() { const p = skiPace(); return p ? `Hard reps at ${fmtPace(p - 6)} to ${fmtPace(p - 4)} per 500 m` : 'Hard reps at a pace you can hold for every rep'; }

function d1(ctx) {
  return [W(WARM_LOWER), ctx.tw && T('cmj'),
    P('A', 'jump', 'Box jump', { names: { b: 'Box jump', s: 'Seated box jump', p: 'Depth jump, 30 cm box' }, sets: { b: [4, 3], s: [4, 3], p: [4, 3] }, rest: 90, note: 'Max intent every rep. Land soft and step down.' }),
    P('B', 'jshrug', 'Jump shrug', { eq: 'bb', sets: { b: [4, 4], s: [4, 3], p: [5, 3] }, start: { b: 40, s: 50, p: 57.5 }, rest: 120, note: 'Bar from mid-thigh. Drive the hips through, shrug and go up on your toes.', alts: ['Hang high pull', 'Hang power clean'] }),
    M('C', 'squat'),
    A('D1', 'rdl', 'Romanian deadlift', { eq: 'bb', sets: { b: [3, 8, 10], s: [3, 6, 8], p: [3, 5, 6] }, start: { b: 80, s: 95, p: 105 }, inc: 5, rest: 0, note: '2 s lowering, bar dragging the thighs.' }),
    A('D2', 'hlr', 'Hanging leg raise', { sets: { b: [3, 10, 12], s: [3, 12, 15], p: [3, 12, 15] }, rest: 120 }),
    A('E1', 'rfess', 'Rear-foot elevated split squat', { eq: 'db', each: true, sets: { b: [3, 8, 10], s: [3, 8, 10], p: [2, 6, 8] }, start: 16, inc: 2, rest: 0 }),
    A('E2', 'pallof', 'Pallof press', { eq: 'cable', each: true, all: [3, 10, 10], start: 15, rest: 90 }),
    A('F1', 'nordic', 'Nordic hamstring curl', { sets: ctx.ins ? { b: [2, 5, 5], s: [2, 5, 5], p: [2, 5, 5] } : { b: [3, 3, 4], s: [3, 5, 6], p: [2, 4, 5] }, rest: 0, note: 'Lower as slowly as you can, push back up with your hands. Use a band in the Build block if you need it.' }),
    NECK('F2'),
    C(c => c.dl ? easy('Easy bike', 10) : c.tw ? { name: 'Assault bike 10 s peak watts test', desc: '3 × 10 s all-out from a standing start, 2 min easy between. Log your best peak watts.', plan: { rounds: 3, segs: [['All-out', 10, 'w'], ['Easy', 120, 'r']] }, metric: 'peakw' } : bikeSprints(c, c.ins ? 6 : { b: 6, s: 8, p: 10 }[c.blk]))];
}
function d2(ctx) {
  return [W(WARM_GYM),
    P('A1', 'mbchest', 'Med ball chest pass', { sets: { b: [4, 5], s: [4, 5], p: [5, 4] }, rest: 0, note: '3 to 5 kg ball into a wall, as fast as possible.' }),
    P('A2', 'mbrot', 'Med ball rotational throw', { each: true, sets: { b: [3, 4], s: [3, 4], p: [3, 4] }, rest: 75 }),
    M('B', 'bench'), M('C', 'chin'),
    A('D', 'press', 'Push press', { names: { b: 'Strict overhead press', s: 'Push press', p: 'Push press' }, eq: 'bb', sets: { b: [3, 6, 8], s: [4, 5, 5], p: [5, 3, 3] }, start: { b: 45, s: 60, p: 65 }, rest: 150 }),
    A('E1', 'pendlay', 'Pendlay row', { eq: 'bb', sets: { b: [4, 6, 8], s: [4, 5, 6], p: [3, 5, 6] }, start: { b: 70, s: 75, p: 80 }, rest: 0, note: 'Bar dead on the floor every rep.' }),
    A('E2', 'latc', 'Cable lateral raise', { eq: 'cable', all: [3, 12, 15], start: 7.5, inc: 1.25, rest: 90 }),
    A('F1', 'facepull', 'Face pull', { eq: 'cable', all: [3, 12, 15], start: 20, rest: 0, alts: [{ n: 'Band external rotation', eq: 'bw' }] }),
    NECK('F2'),
    C(c => c.dl ? easy('Easy bike', 10) : c.tw ? { name: 'Assault bike 3 min max calories test', desc: '3 minutes all-out. Log your total calories. This sets every bike target in the app.', plan: { segs: [['Max calories', 180, 'w']] }, metric: 'bike3' } : (() => { const [n, ev] = { b: [8, 75], s: [10, 75], p: [10, 60] }[c.blk]; return { name: 'Assault bike 10 × 10 calories', desc: `${n} × 10 calories, one starting every ${fmtT(ev)}. Every rep under 30 s.`, target: 'The hard one. Hold your rep time steady.', plan: { rounds: n, segs: [['10 cal, go', 30, 'w'], ['Rest', ev - 30, 'r']] } }; })())];
}
function d3(ctx) {
  const p = ctx.blk === 'p';
  return [W(WARM_LOWER), ctx.tw && T('broad'),
    P('A', 'sled', 'Sled push', { names: { b: 'Sled push, moderate and fast', s: 'Sled push, heavy', p: 'Sled push, heavy' }, unit: 'm', eq: 'sled', sets: { b: [5, 15], s: [5, 15], p: [4, 10] }, start: { b: 40, s: 80, p: 100 }, rest: 120, note: p ? 'Then 3 × 15 m light and fast. Low body angle, drive like you are hitting a ruck.' : 'Low body angle, drive like you are hitting a ruck.', alts: [{ n: 'Broad jump', eq: 'bw', unit: 'reps' }, { n: 'Lateral bound', eq: 'bw', unit: 'reps' }] }),
    P('B', 'tbjump', 'Trap bar jump', { eq: 'trap', sets: { b: [4, 3], s: [4, 3], p: [5, 3] }, start: { b: 30, s: 40, p: 40 }, rest: 120, note: p ? 'First Power week: try 20, 30, 40 and 50 kg. Keep the load you jump highest with.' : 'Jump as high as you can. Reset between reps.' }),
    M('C', 'trap'),
    A('D', 'fsq', 'Front squat', { eq: 'bb', sets: { b: [3, 8, 8], s: [3, 6, 6], p: [3, 5, 5] }, start: { b: 70, s: 75, p: 80 }, rest: 150, alts: [{ n: 'Hack squat', eq: 'machine', start: 80 }] }),
    A('E1', 'lunge', 'Walking lunge', { eq: 'db', each: true, sets: { b: [3, 10, 10], s: [3, 10, 10], p: [2, 10, 10] }, start: 20, inc: 2, rest: 0 }),
    A('E2', 'cph', 'Copenhagen plank', { unit: 's', each: true, sets: { b: [3, 20, 20], s: [3, 25, 25], p: [3, 25, 25] }, rest: 90 }),
    A('F1', 'lcurl', 'Lying leg curl', { eq: 'machine', sets: { b: [3, 10, 12], s: [3, 8, 10], p: [3, 8, 8] }, start: 40, rest: 0 }),
    A('F2', 'calf', 'Standing calf raise', { eq: 'machine', all: [3, 12, 15], start: 60, inc: 5, rest: 75, note: '2 s pause at the bottom.' }),
    A('G1', 'backext', 'Back extension', { all: [2, 12, 12], rest: 0 }),
    NECK('G2'),
    C(c => c.ins ? bikeSprints(c, 6) : c.dl ? easy('Easy ski', 10) : c.blk === 'b' ? { name: 'Easy ski erg', desc: '15 min steady. Your legs rest while your arms and lungs work.', target: skiZ2(), plan: { segs: [['Easy ski', 900, 'r']] } } : (() => { const n = c.blk === 's' ? 8 : 10; return { name: 'Ski erg 30/30s', desc: `${n} × 30 s hard, 30 s easy. Damper 5 to 7.`, target: ski30(), plan: { rounds: n, segs: [['Hard', 30, 'w'], ['Easy', 30, 'r']] } }; })())];
}
function d4(ctx) {
  return [W(WARM_GYM),
    A('A', 'incdb', 'Incline DB press, 30°', { eq: 'db', sets: { b: [4, 8, 10], s: [4, 8, 8], p: [4, 6, 8] }, start: 30, inc: 2, rest: 150 }),
    A('B', 'wpull', 'Weighted wide pull-up', { eq: 'add', sets: { b: [4, 8, 10], s: [4, 8, 8], p: [4, 6, 8] }, start: 5, rest: 150, note: 'Full stretch at the bottom.', alts: [{ n: 'Lat pulldown', eq: 'machine', start: 65 }] }),
    A('C1', 'dip', 'Weighted dip', { eq: 'add', all: [3, 8, 12], start: 10, rest: 0, note: 'Lean forward for chest.', alts: [{ n: 'Machine chest press', eq: 'machine', start: 70 }, { n: 'Flat DB press', eq: 'db', start: 32 }] }),
    A('C2', 'csrow', 'Chest-supported row', { eq: 'machine', all: [3, 10, 12], start: 60, rest: 120, note: 'Squeeze for 1 s at the top.' }),
    A('D1', 'latdb', 'Lateral raise', { eq: 'db', all: [4, 12, 20], start: 10, inc: 2, rest: 0, note: 'The V-taper. Last set to failure, then a drop set.' }),
    A('D2', 'rdfly', 'Rear delt fly', { eq: 'cable', all: [3, 12, 15], start: 7.5, inc: 1.25, rest: 75 }),
    A('E1', 'ohtri', 'Overhead cable triceps extension', { eq: 'cable', all: [3, 10, 12], start: 25, rest: 0 }),
    A('E2', 'incurl', 'Incline DB curl', { eq: 'db', all: [3, 10, 12], start: 12, inc: 2, rest: 75 }),

function lineChart(pts, o = {}) {

  const step = [.05, .1, .2, .25, .5, 1, 2, 2.5, 5, 10, 15, 20, 25, 30, 50, 60, 100, 200, 500].find(st => (mx - mn) / st <= 4) || 1000;

function chartPtr(e) {

    openNum({ title: `${it.name}: weight`, sub: it.eq === 'add' ? 'Kilos added on the belt or between your feet.' : it.eq === 'db' ? 'Per dumbbell.' : '', val: s.w ?? 0, step, big: it.eq === 'sled' ? 20 : 10, min: 0, fmt: it.eq === 'add' ? 'add' : 'kg', plate: it.eq === 'bb' ? S.settings.bar : it.eq === 'trap' ? S.settings.trapBar : 0, canApply: j < it.sets.length - 1, target: { t: 'set', i, j, f } });
  } else openNum({ title: `${it.name}: ${it.unit === 's' ? 'seconds' : it.unit === 'm' ? 'metres' : 'reps'}`, val: s.r, step: it.unit === 's' ? 5 : 1, big: it.unit === 's' || it.unit === 'm' ? 10 : 5, min: 0, fmt: 'n', canApply: j < it.sets.length - 1, target: { t: 'set', i, j, f } });
}
function applyNum(v) {
  const sh = ui.sheet, tg = sh.target;
  if (tg.t === 'set') {
    const it = S.active.items[tg.i], s = it.sets[tg.j], ap = $('#sapply'), apply = ap ? ap.checked : false;
    s[tg.f] = v;
    if (apply) it.sets.forEach((x, k) => { if (k > tg.j && !x.done && (tg.f === 'r' || x.tag === s.tag)) x[tg.f] = v; });
  } else if (tg.t === 'item') { const it = S.active.items[tg.i]; it.val = v; it.edited = true; }
  else if (tg.t === 'bw') { ui.bwDraft = v; ui.sheet = null; ACT.bwlog(); return; }
  else if (tg.t === 'e1rm') { S.e1rm[tg.l] = v; S.e1rmEst[tg.l] = false; S.hist[tg.l].push({ d: today(), v }); }
  else if (tg.t === 'bar') S.settings[tg.k] = v;
  else if (tg.t === 'adj') S.settings[tg.k] = v;
  else if (tg.t === 'test') { (S.tests[tg.k] = S.tests[tg.k] || []).push({ d: today(), v }); toast(`${TESTS[tg.k].name} logged.`); }
  ui.sheet = null; save(); render();
}
function parseTyped(raw, fmt) {
  raw = String(raw).trim().replace(',', '.');
  if (fmt === 'time' && raw.includes(':')) { const [m, s] = raw.split(':'); return (+m) * 60 + (+s || 0); }
  return parseFloat(raw.replace('+', ''));
}
async function exportData() {
  const json = JSON.stringify(S), name = `breakdown-backup-${today()}.json`;
  try { const f = new File([json], name, { type: 'application/json' }); if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: 'Breakdown backup' }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  try { const url = URL.createObjectURL(new Blob([json], { type: 'application/json' })); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); toast('Backup saved.'); } catch (e) { copyData(); }
}
async function copyData() { try { await navigator.clipboard.writeText(JSON.stringify(S)); toast('Backup copied. Paste it into Notes to keep it safe.'); } catch (e) { toast('Copy did not work here. Use Share backup instead.'); } }
function doImport(text) {
  try { const o = JSON.parse(text); if (!o || o.v !== 1 || !o.settings || !o.e1rm) throw 0; S = hydrate(o); ui.sheet = null; ui.view = S.active ? 'session' : 'tabs'; save(); render(); toast('Backup restored.'); }
  catch (e) { toast('That is not a Breakdown backup. Check the file and try again.'); }
}

const ACT = {

    save(); render();

  logall(o) { const it = S.active.items[o.i]; it.sets.forEach(s => { s.done = true; }); save(); render(); },
  effort(o) { S.active.items[o.i].effort = o.v; save(); render(); },
  edit(o) { editSet(o.i, o.j, o.f); },

  logtest(o) { const t = TESTS[o.v]; openNum({ title: t.name, sub: t.note, val: latest(o.v) ?? t.def, step: t.step, big: t.big, min: 0, fmt: t.unit === 'time' ? 'time' : t.unit === 's' ? 's' : 'n', target: { t: 'test', k: o.v } }); },
  swap(o) { ui.sheet = { kind: 'swap', i: o.i }; render(); },
  doswap(o) {
    const it = S.active.items[ui.sheet.i];
    if (it.k === 'main') { if (o.v === it.base) delete S.swaps[it.lift]; else S.swaps[it.lift] = o.v; it.name = o.v; }
    else {
      if (o.v === it.base) delete S.swaps[it.id]; else S.swaps[it.id] = o.v;
      const fresh = materialize(S.active.sid, S.active.feel, S.active.w).find(x => x.id === it.id && x.g === it.g);
      if (fresh) { const done = it.sets.filter(s => s.done).length; S.active.items[ui.sheet.i] = done ? { ...fresh, sets: fresh.sets.map((s, k) => it.sets[k] && it.sets[k].done ? it.sets[k] : s) } : fresh; }
    }
    ui.sheet = null; save(); render();
  },
  timer(o) { startTimer(o.i); },
  tpause() { const T = ui.timer; if (T.paused) { T.segEnd = Date.now() + T.left; T.paused = false; } else { T.left = T.segEnd - Date.now(); T.paused = true; } render(); },
  tnext() { const T = ui.timer; if (T.paused) { T.paused = false; } T.segEnd = Date.now(); timerTick(); },
  tprev() { const T = ui.timer; T.idx = Math.max(0, T.idx - 1); T.segEnd = Date.now() + T.plan[T.idx].s * 1000; T.paused = false; T.last = -1; render(); },
  tclose() { const T = ui.timer; ui.timer = null; if (!S.active) releaseWake(); render(); if (T && T.done && T.metric) toast('Enter your result on the card.'); },
  stopwatch(o) { ui.sw = { i: o.i, acc: 0, running: false, t0: 0 }; requestWake(); render(); },
  swstart() { const W2 = ui.sw; W2.t0 = Date.now(); W2.running = true; beepSeq('go'); render(); },
  swstop() { const W2 = ui.sw; W2.acc += (Date.now() - W2.t0) / 1000; W2.running = false; beepSeq('rest'); render(); },
  swreset() { ui.sw = { ...ui.sw, acc: 0, running: false }; render(); },
  swsave() { const W2 = ui.sw, it = S.active.items[W2.i]; it.val = Math.round(W2.acc); it.edited = true; it.done = true; ui.sw = null; save(); render(); toast('Bronco time saved. Your running targets update when you finish.'); },
  swclose() { ui.sw = null; render(); },
  rest(o) { const A = S.active; if (!A.restEnd) return; const rit = A.items[A.restItem], left = (A.restEnd - Date.now()) / 1000;
    if (rit) { if (o.v === 'skip') { if (left > 15) rit.restSkip = (rit.restSkip || 0) + 1; } else if (+o.v > 0) rit.restPlus = (rit.restPlus || 0) + 1; else rit.restSkip = (rit.restSkip || 0) + 1; }
    if (o.v === 'skip') A.restEnd = null; else { A.restEnd += (+o.v) * 1000; A.restTotal = Math.max(A.restTotal, (A.restEnd - Date.now()) / 1000); A.restBeeped = false; } save(); updateRestBar(); },
  finish() { ui.sheet = { kind: 'finish' }; render(); },
  discard() { ui.sheet = { kind: 'finish', confirm: true }; render(); },
  discard2() { S.active = null; ui.sheet = null; ui.view = 'tabs'; releaseWake(); save(); render(); toast('Session discarded.'); },
  savesession() { finishSession(); },
  tag(o) { const sh = ui.sheet, n = $('#sessnote'); if (n) sh.note = n.value; sh.tags = sh.tags || []; sh.tags = sh.tags.includes(o.v) ? sh.tags.filter(x => x !== o.v) : [...sh.tags, o.v]; render(); },
  note(o) { ui.sheet = { kind: 'note', i: o.i }; render(); setTimeout(() => { const t = $('#notetext'); if (t) t.focus(); }, 30); },
  savenote() { const it = S.active.items[ui.sheet.i], v = ($('#notetext').value || '').trim(); if (v) S.notes[it.name] = v; else delete S.notes[it.name]; ui.sheet = null; save(); render(); toast(v ? 'Note saved. It will show here every session.' : 'Note removed.'); },
  delnote() { const it = S.active.items[ui.sheet.i]; delete S.notes[it.name]; ui.sheet = null; save(); render(); toast('Note removed.'); },
  gfix(o) { S.settings[o.v] += +o.f; save(); render(); toast('Calories adjusted. The food card shows the new numbers.'); },
  async copyreport() { const txt = report(); try { await navigator.clipboard.writeText(txt); toast('Report copied. Paste it to Claude.'); } catch (e) { ui.sheet = { kind: 'report' }; render(); const t = $('#reporttext'); if (t) { t.focus(); t.select(); } } },
  closesheet() { if (ui.sheet && ui.sheet.kind === 'welcome') return; ui.sheet = null; render(); },
  wstep(o) { const sh = ui.sheet; sh[o.f] = Math.max(0, Math.round((sh[o.f] + (+o.v)) * 10) / 10); render(); },
  wmode(o) { ui.sheet.mode = o.v; render(); },
  welcomedone() {
    const sh = ui.sheet, d = today(), bench = Math.round(sh.benchW * (1 + 5 / 30) * 2) / 2;

  ssave() { const sh = ui.sheet; let v = sh.val; if (sh.typing) { const p = parseTyped($('#sinput').value, sh.fmt); if (isNaN(p)) { toast('That is not a number. Try again.'); return; } v = p; } applyNum(Math.max(sh.min ?? 0, v)); },
  bw(o) { const tr = trendSeries(), last = tr[tr.length - 1]; ui.bwDraft = Math.round(((ui.bwDraft ?? (last ? last.kg : 84)) + (+o.v)) * 10) / 10; render(); },
  bwsheet() { const tr = trendSeries(), last = tr[tr.length - 1]; openNum({ title: 'Bodyweight', sub: 'Morning, after the toilet, before food.', val: ui.bwDraft ?? (last ? last.kg : 84), step: .1, big: 1, min: 30, fmt: 'n', target: { t: 'bw' } }); },
  bwlog() { const tr = trendSeries(), last = tr[tr.length - 1], v = ui.bwDraft ?? (last ? last.kg : 84), d = today(); S.bw = S.bw.filter(e => e.d !== d); S.bw.push({ d, kg: Math.round(v * 10) / 10 }); ui.bwDraft = null; save(); render(); toast(`${v.toFixed(1)} kg logged.`); },
  daytype(o) { ui.dayType = o.v; render(); },

  bar(o) { openNum({ title: o.v === 'bar' ? 'Barbell weight' : 'Trap bar weight', val: S.settings[o.v], step: 2.5, big: 5, min: 0, fmt: 'kg', target: { t: 'bar', k: o.v } }); },
  adj(o) { openNum({ title: o.v === 'adjLift' ? 'Training day adjustment' : 'Rest day adjustment', sub: 'Added to or taken from the base calories.', val: S.settings[o.v], step: 50, big: 200, min: -1000, fmt: 'n', target: { t: 'adj', k: o.v } }); },
  sound() { S.settings.sound = !S.settings.sound; save(); render(); if (S.settings.sound) beep(); },
  export() { exportData(); },
  copy() { copyData(); },
  import() { ui.sheet = { kind: 'imp' }; render(); },
  async doimport() { const f = $('#impfile'), t = $('#imptext'); if (f && f.files && f.files[0]) doImport(await f.files[0].text()); else if (t && t.value.trim()) doImport(t.value.trim()); else toast('Pick a file or paste the backup text first.'); },

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  if (b.dataset.a === 'noop') { if (e.target.closest('[data-a]') === b) return; }
  unlockAudio();
  const fn = ACT[b.dataset.a]; if (!fn) return;
  if (b.dataset.a === 'closesheet' && e.target !== b && !e.target.closest('button[data-a="closesheet"]')) return;
  fn({ v: b.dataset.v, i: +b.dataset.i, j: +b.dataset.j, f: b.dataset.f });
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && $('#sinput')) ACT.ssave(); if (e.key === 'Escape' && ui.sheet) ACT.closesheet(); });
setInterval(() => {
  if (S.active) { const el = $('#elapsed'); if (el) el.textContent = fmtT((Date.now() - S.active.start) / 1000); updateRestBar(); }
  if (ui.timer) timerTick();
  if (ui.sw) swTick();
}, 250);
if (S.active) requestWake();
