<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Breakdown</title>
<meta name="description" content="Back row training program and one-tap session tracker.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Breakdown">
<meta name="theme-color" content="#0F1512">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one-column phone shell. Fixed header, scrolling middle, bottom tabs.
   A live session swaps the tabs for a floating rest bar. Full-screen interval timer on top. */
:root{
  --bg:#0F1512; --surface:#171F1A; --surface2:#212B25; --line:#2C3831;
  --fg:#EDF0E9; --muted:#93A198; --accent:#E8B23B; --accent-ink:#1B1505;
  --good:#5CC28B; --good-bg:rgba(92,194,139,.15); --warn:#E8904F; --warn-bg:rgba(232,144,79,.14);
  --accent-bg:rgba(232,178,59,.14);
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:16px; --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;-webkit-text-size-adjust:100%}
body{overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{font:inherit;color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;-webkit-user-select:text;user-select:text}
p{margin:0;line-height:1.45}
#app{height:100%;display:flex;flex-direction:column}
.top{flex:none;display:flex;align-items:center;gap:12px;padding:calc(var(--safe-t) + 12px) 16px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:16px 16px calc(112px + var(--safe-b));display:flex;flex-direction:column;gap:14px}
.grow{flex:1;min-width:0}
.eyebrow{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.09em;font-size:13px;color:var(--muted)}
.h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;letter-spacing:.005em;text-wrap:balance}
.h2{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.05}
.h3{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.1}
.sub{color:var(--muted);margin-top:4px}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between} .end{justify-content:flex-end}
.btn{min-height:48px;border-radius:13px;padding:0 18px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.sm{min-height:38px;padding:0 14px;border-radius:11px;font-size:14px}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:var(--surface2)}
.btn-ghost.on{background:var(--good);color:var(--bg)}
.wide{width:100%}
.chip{min-height:38px;padding:0 14px;border-radius:999px;background:var(--surface2);font-size:14px;font-weight:550;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chip.done{background:var(--good-bg);color:var(--good)}
.pill{font-size:12px;font-weight:650;padding:4px 9px;border-radius:999px;background:var(--surface2);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.acc{background:var(--accent-bg);color:var(--accent)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg .chip{justify-content:center}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.4}
.ic{width:20px;height:20px;flex:none} .ic.sm{width:16px;height:16px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface2);flex:none}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;font-weight:600;color:var(--muted);text-align:center}
.tab .ic{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--accent)}
/* week strip */
.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.wk{height:9px;border-radius:3px;background:var(--surface2)}
.wk.past{background:var(--muted);opacity:.55} .wk.cur{background:var(--accent)} .wk.dl:not(.cur):not(.past){background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.strip-l{display:grid;grid-template-columns:repeat(3,1fr);font-family:var(--display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.strip-l span:nth-child(2){text-align:center} .strip-l span:nth-child(3){text-align:right}
/* next card */
.next .h1{font-size:44px}
.preview{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.preview li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.preview li span:first-child{min-width:0}
.preview li span:last-child{text-align:right;flex:none;max-width:50%}
.resume{background:var(--accent-bg);border-color:var(--accent);text-align:left}
/* bodyweight */
.bwrow{display:grid;grid-template-columns:52px 1fr 52px auto;gap:8px;align-items:center}
.step{height:52px;min-width:52px;border-radius:13px;background:var(--surface2);font-size:20px;font-weight:600;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.bwval{height:52px;border-radius:13px;background:var(--surface2);font-family:var(--display);font-size:30px;font-weight:700;display:flex;align-items:baseline;justify-content:center;gap:4px;padding-top:8px}
.bwval small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.macros div{background:var(--surface2);border-radius:12px;padding:10px 6px;text-align:center}
.macros b{display:block;font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.macros small{font-size:11px;color:var(--muted)}
/* session */
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:14px}
.group-l{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--accent)}
.group .item + .item{border-top:1px solid var(--line);padding-top:14px}
.item{display:flex;flex-direction:column;gap:10px}
.item.warm{flex-direction:row;align-items:center;gap:12px}
.item.is-done .exname,.item.is-done .h3{color:var(--good)}
.exhead{display:flex;gap:10px;align-items:flex-start}
.tag{font-family:var(--display);font-weight:700;font-size:15px;min-width:32px;height:26px;padding:0 6px;border-radius:8px;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:none;margin-top:1px}
.exname{font-weight:650;font-size:17px;display:inline-flex;gap:6px;align-items:center;line-height:1.25}
.exname .ic{color:var(--muted)}
.presc{color:var(--muted);font-size:13.5px;margin-top:3px;line-height:1.35}
.note{font-size:13px;color:var(--muted)}
.target{font-size:14px;color:var(--accent);font-weight:600}
.sets{display:flex;flex-direction:column;gap:8px}
.setrow{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) 58px;gap:8px;align-items:center}
.si{font-family:var(--display);font-size:14px;font-weight:600;color:var(--muted);text-align:center;text-transform:uppercase}
.val{height:54px;border-radius:13px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:0 6px;min-width:0;text-align:center}
.val span{font-family:var(--display);font-size:26px;font-weight:650;font-variant-numeric:tabular-nums}
.val small{font-size:10.5px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.val.span2{grid-column:span 2}
.val.big{height:64px;min-width:120px;flex:1}
.val.big span{font-size:34px}
.val.dim span{color:var(--muted)}
.tick{height:54px;width:58px;border-radius:15px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.tick .ic{width:26px;height:26px}
.tick.on{background:var(--good);border-color:var(--good);color:var(--bg)}
.setrow.done .val{background:var(--good-bg)} .setrow.done .val span{color:var(--good)}
.exfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.effort{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.effort .eyebrow{margin-right:2px}
.reps{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.rep{height:54px;border-radius:13px;background:var(--surface2);font-family:var(--display);font-size:22px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:4px}
.rep.on{background:var(--good);color:var(--bg)}
.elapsed{font-family:var(--display);font-size:20px;font-weight:600;color:var(--muted)}
/* rest bar */
.restbar{position:fixed;left:12px;right:12px;bottom:calc(12px + var(--safe-b));z-index:9;background:var(--fg);color:var(--bg);border-radius:20px;padding:10px 10px 14px 16px;display:grid;grid-template-columns:1fr auto auto auto;grid-template-areas:"l l l l" "t a b c";column-gap:8px;row-gap:4px;align-items:center;box-shadow:0 12px 34px rgba(0,0,0,.35);overflow:hidden}
.restbar .rt{grid-area:t} .restbar .rl{grid-area:l} .restbar button:nth-of-type(1){grid-area:a} .restbar button:nth-of-type(2){grid-area:b} .restbar button:nth-of-type(3){grid-area:c}
.restbar .rt{font-family:var(--display);font-size:38px;font-weight:700;font-variant-numeric:tabular-nums;min-width:86px;line-height:1}
.restbar .rl{flex:1;min-width:0;font-size:13px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.restbar .rl b{font-size:11px;text-transform:uppercase;letter-spacing:.07em;opacity:.65;margin-right:6px}
.restbar button{height:44px;min-width:52px;padding:0 10px;border-radius:12px;background:rgba(128,128,128,.2);font-weight:650;font-size:14px;text-align:center}
.restbar .rp{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);transition:width .25s linear}
.restbar.go{background:var(--accent);color:var(--accent-ink)}
.restbar.go .rp{background:var(--accent-ink)}
/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:flex-end}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + var(--safe-b));display:flex;flex-direction:column;gap:14px;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
.sh-title{font-family:var(--display);font-weight:700;font-size:24px}
.stepper{display:grid;grid-template-columns:repeat(2,minmax(48px,60px)) minmax(0,1fr) repeat(2,minmax(48px,60px));gap:8px;align-items:center}
.stepper .step{font-size:15px}
.bigval{height:72px;border-radius:14px;background:var(--surface2);font-family:var(--display);font-size:42px;font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;width:100%;text-align:center}
input.bigval{border:2px solid var(--accent);padding:0}
.plates{text-align:center;color:var(--muted);font-size:14px}
.check{display:flex;gap:10px;align-items:center;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.list{display:flex;flex-direction:column;gap:6px}
.list button{min-height:54px;padding:8px 14px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:550}
.list button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:var(--surface2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:24px;font-weight:700}
.stat small{font-size:11px;color:var(--muted)}
.changes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.changes li{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:8px 10px;border-radius:10px;background:var(--good-bg)}
.changes li b{color:var(--good);font-variant-numeric:tabular-nums}
/* timer */
.timer{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;gap:10px;padding:calc(var(--safe-t) + 16px) 20px calc(var(--safe-b) + 20px);background:var(--bg);color:var(--fg)}
.timer.w{background:var(--accent);color:var(--accent-ink)}
.timer.r{background:var(--surface2);color:var(--fg)}
.timer .iconbtn{background:rgba(128,128,128,.22)}
.trow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tname{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.06em}
.tbody{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;text-align:center}
.tlabel{font-family:var(--display);font-weight:700;font-size:clamp(28px,9vw,46px);line-height:1.05;text-wrap:balance}
.count{font-family:var(--display);font-weight:700;font-size:clamp(120px,46vw,260px);line-height:.85;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tmeta{font-size:16px;font-weight:600;opacity:.8}
.tnext{font-size:15px;opacity:.75}
.tctl{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px}
.timer .btn-ghost{background:rgba(128,128,128,.22)}
.timer.w .btn-primary{background:var(--accent-ink);color:var(--accent)}
/* progress */
.maxes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.maxes .card{gap:4px;padding:14px}
.maxes b{font-family:var(--display);font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.chart{width:100%;height:auto;display:block}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent-bg)}
.chart .dt{fill:var(--muted);opacity:.55}
.chart .end{fill:var(--accent)}
.chart .gr{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.tablewrap{overflow-x:auto;margin:0 -2px}
.wklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.wkrow{display:flex;gap:12px;padding:10px 8px;border-bottom:1px solid var(--line);border-radius:10px}
.wkrow.cur{background:var(--accent-bg)}
.wkrow .wkn{font-family:var(--display);font-size:26px;font-weight:700;width:30px;text-align:center;line-height:1;padding-top:2px;color:var(--muted)}
.wkrow.cur .wkn{color:var(--accent)}
.wkrow .grow{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.wkrow b{font-size:15px;color:var(--fg)}
.list .tl{display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0}
.list .tl small{font-size:12px;font-weight:500}
.list .tr{display:flex;align-items:center;gap:8px;flex:none}
.list .tr b{font-family:var(--display);font-size:20px}
.tbl{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.cur td{background:var(--accent-bg)}
.tbl button{width:100%;text-align:left}
details.hist{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
details.hist summary{list-style:none;display:flex;justify-content:space-between;gap:10px;cursor:pointer}
details.hist summary::-webkit-details-marker{display:none}
details.hist ul{margin:10px 0 0;padding-left:18px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;line-height:1.45}
.setting{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0}
.setting + .setting{border-top:1px solid var(--line);padding-top:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--safe-t) + 14px);z-index:40;background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.3);text-align:center}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}.restbar .rp{transition:none}}
@media (min-width:640px){.main,.top{padding-left:max(16px,calc(50% - 300px));padding-right:max(16px,calc(50% - 300px))}.restbar{left:max(12px,calc(50% - 300px));right:max(12px,calc(50% - 300px))}}
</style>

<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<noscript><p style="padding:24px">Breakdown needs JavaScript turned on.</p></noscript>
<script>
'use strict';
/* =========================================================
   Breakdown: back row program + session tracker
   Data lives in localStorage on this device only.
   ========================================================= */
const KEY = 'breakdown:v1';
const $ = s => document.querySelector(s);
const z2 = n => String(n).padStart(2, '0');
const dstr = d => d.getFullYear() + '-' + z2(d.getMonth() + 1) + '-' + z2(d.getDate());
const today = () => dstr(new Date());
const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00') - new Date(a + 'T12:00')) / 864e5);
const r25 = x => Math.round(x / 2.5) * 2.5;
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtW = x => x == null ? '–' : String(Math.round(x * 100) / 100);
function fmtT(sec) { if (sec == null || isNaN(sec)) return '–'; sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return h ? h + ':' + z2(m) + ':' + z2(s) : m + ':' + z2(s); }
function fmtPace(sec) { const m = Math.floor(sec / 60), s = sec - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1); }
const fmtRest = s => !s ? 'none' : s < 60 ? s + ' s' : (s % 60 ? fmtT(s) : (s / 60) + ' min');
const restTxt = s => s ? 'rest ' + fmtRest(s) : 'straight into the next one';
const fmtClock = t => { const d = new Date(t); return z2(d.getHours()) + ':' + z2(d.getMinutes()); };
const fmtDate = d => new Date(d + 'T12:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });

/* ---------- icons ---------- */
const ICON = {
  home: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',

/* ---------- saving a session ---------- */
const rirOf = e => e === 'easy' ? 3 : e === 'grind' ? 0 : 1.5;
function applySession(A, st) {
  const ch = [], bw = st.bw.length ? [...st.bw].sort((a, b) => a.d < b.d ? -1 : 1).pop().kg : 84, d = today();
  const pushTest = (k, v) => { (st.tests[k] = st.tests[k] || []).push({ d, v }); ch.push({ t: TESTS[k].name, v: fmtTest(k, v) + (TESTS[k].unit === 'time' || TESTS[k].unit === 's' ? '' : ' ' + TESTS[k].unit) }); };
  A.items.forEach(it => {
    if (it.k === 'main') {
      const done = it.sets.filter(s => s.done); if (!done.length || it.name !== it.base) return;
      const kind = done.some(s => s.tag === 'test') ? 'test' : done.some(s => s.tag === 'top') ? 'top' : 'work';
      const pool = done.filter(s => kind === 'work' || s.tag === kind);
      const rir = kind === 'test' ? (it.effort === 'easy' ? 3 : it.effort === 'grind' ? 0 : 2) : rirOf(it.effort);
      const mass = s => it.lift === 'chin' ? s.w + bw : s.w;
      const est = Math.max(...pool.map(s => mass(s) * (1 + (s.r + rir) / 30)));
      const old = st.e1rm[it.lift], missed = done.some(s => s.r < s.tr);
      let nv = old;
      if (kind === 'test') { nv = est; st.e1rmEst[it.lift] = false; }
      else { if (est > nv) nv = est; if (it.effort === 'easy' && !missed) nv = Math.max(nv, old + it.inc); if (missed || it.effort === 'grind') nv = Math.min(nv, Math.max(old * .975, est)); }
      nv = Math.round(nv * 2) / 2;
      if (Math.abs(nv - old) >= .5) { st.e1rm[it.lift] = nv; st.hist[it.lift].push({ d, v: nv }); ch.push({ t: `${LIFTS[it.lift].name} max`, v: `${fmtW(old)} → ${fmtW(nv)} kg` }); }
    } else if (it.k === 'acc' || it.k === 'power') {
      const done = it.sets.filter(s => s.done); if (!done.length) return;
      const prev = st.last[it.key];
      st.last[it.key] = { w: done[done.length - 1].w, reps: done.map(s => s.r), n: it.sets.length, lo: it.lo, hi: it.hi, effort: it.effort, d };
      if (it.k === 'acc' && prev && prev.w != null && done[done.length - 1].w > prev.w) ch.push({ t: it.name, v: `${fmtW(prev.w)} → ${fmtW(done[done.length - 1].w)} kg` });
    } else if (it.k === 'test' && it.done && it.edited) pushTest(it.key, it.val);
    else if (it.k === 'cond' && it.metric && it.edited) pushTest(it.metric, it.val);
  });
  return ch;
}
function finishSession() {
  const A = S.active, ch = applySession(A, S);
  S.sessions.push({ id: Date.now().toString(36), sid: A.sid, w: A.w, cycle: A.cycle, d: dstr(new Date(A.start)), start: A.start, end: Date.now(), feel: A.feel,
    items: A.items.filter(it => it.k !== 'warm').map(it => ({ k: it.k, name: it.name, sets: it.sets ? it.sets.filter(s => s.done).map(s => ({ w: s.w ?? null, r: s.r ?? null })) : undefined, total: it.sets ? it.sets.length : undefined, label: it.label, unit: it.unit, eq: it.eq, effort: it.effort, val: (it.k === 'test' || it.metric) && it.edited ? it.val : undefined, key: it.key || it.metric, done: it.done })) });
  S.active = null; ui.sheet = null; ui.view = 'tabs'; ui.tab = 'today'; ui.feel = 'normal';
  const adv = maybeAdvance(); save(); releaseWake(); render();
  toast(adv || (ch.length ? `Saved. ${ch.length} new ${ch.length === 1 ? 'best' : 'bests'}.` : 'Session saved.'));
}
function maybeAdvance() {
  const st = S.settings, core = CORE[st.mode];
  const done = new Set(S.sessions.filter(s => s.w === st.week && s.cycle === st.cycle).map(s => s.sid));
  if (!core.every(c => done.has(c))) return null;
  if (st.week < 12) { st.week++; return `Week ${st.week - 1} done. On to week ${st.week}: ${weekName(st.week)}.`; }
  st.cycle++; st.week = 1; return `All 12 weeks done. Cycle ${st.cycle} starts now, built on your new maxes.`;
}

/* ---------- progress ---------- */
function spark(vals) {
  if (vals.length < 2) return '<svg class="chart" viewBox="0 0 140 36" aria-hidden="true"><line class="gr" x1="0" y1="30" x2="140" y2="30"/></svg>';
  const mn = Math.min(...vals), mx = Math.max(...vals), sp = mx - mn || 1;
  const pts = vals.map((v, i) => [i / (vals.length - 1) * 132 + 4, 30 - (v - mn) / sp * 24]);
  const p = pts.map(q => q.map(n => n.toFixed(1)).join(',')).join(' '), e = pts[pts.length - 1];
  return `<svg class="chart" viewBox="0 0 140 36" aria-hidden="true"><polygon class="ar" points="4,32 ${p} ${e[0].toFixed(1)},32"/><polyline class="ln" points="${p}"/><circle class="end" cx="${e[0].toFixed(1)}" cy="${e[1].toFixed(1)}" r="3.5"/></svg>`;
}
function bwChart() {
  const s = trendSeries().slice(-90);
  if (s.length < 2) return '<p class="muted small">Log a few morning weigh-ins on the Today tab and your trend line appears here.</p>';
  const all = s.flatMap(e => [e.kg, e.t]), mn = Math.floor(Math.min(...all) - .3), mx = Math.ceil(Math.max(...all) + .3), sp = mx - mn || 1;
  const W2 = 320, H = 150, L = 34, Rr = 8, Tp = 10, B = 24;
  const x = i => L + i / (s.length - 1) * (W2 - L - Rr), y = v => Tp + (1 - (v - mn) / sp) * (H - Tp - B);
  const tl = s.map((e, i) => x(i).toFixed(1) + ',' + y(e.t).toFixed(1)).join(' ');
  const ticks = [mn, (mn + mx) / 2, mx];
  return `<svg class="chart" viewBox="0 0 ${W2} ${H}" role="img" aria-label="Bodyweight trend">
  ${ticks.map(v => `<line class="gr" x1="${L}" x2="${W2 - Rr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${L - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${fmtW(Math.round(v * 10) / 10)}</text>`).join('')}
  ${s.map((e, i) => `<circle class="dt" cx="${x(i).toFixed(1)}" cy="${y(e.kg).toFixed(1)}" r="2.6"/>`).join('')}
  <polyline class="ln" points="${tl}"/><circle class="end" cx="${x(s.length - 1).toFixed(1)}" cy="${y(s[s.length - 1].t).toFixed(1)}" r="4"/>
  <text x="${L}" y="${H - 6}">${fmtDate(s[0].d)}</text><text x="${W2 - Rr}" y="${H - 6}" text-anchor="end">${fmtDate(s[s.length - 1].d)}</text></svg>
  <p class="muted small">Dots are your scale readings. The line is your trend, which ignores day-to-day water swings.</p>`;
}
const GOALS = { squat: { x: 1.75, t: '1.75 × BW' }, bench: { x: 1.4, t: '1.4 × BW' }, trap: { x: 2.2, t: '2.2 × BW' }, chin: { add: 40, t: '+40 kg for 1 rep' } };

function editSet(i, j, f) {

    openNum({ title: `${it.name}: weight`, sub: it.eq === 'add' ? 'Kilos added on the belt or between your feet.' : it.eq === 'db' ? 'Per dumbbell.' : '', val: s.w ?? 0, step, big: it.eq === 'sled' ? 20 : 10, min: 0, fmt: it.eq === 'add' ? 'add' : 'kg', plate: it.eq === 'bb' ? S.settings.bar : it.eq === 'trap' ? S.settings.trapBar : 0, canApply: j < it.sets.length - 1, target: { t: 'set', i, j, f } });
  } else openNum({ title: `${it.name}: ${it.unit === 's' ? 'seconds' : it.unit === 'm' ? 'metres' : 'reps'}`, val: s.r, step: it.unit === 's' ? 5 : 1, big: it.unit === 's' || it.unit === 'm' ? 10 : 5, min: 0, fmt: 'n', canApply: j < it.sets.length - 1, target: { t: 'set', i, j, f } });
}
function applyNum(v) {
  const sh = ui.sheet, tg = sh.target;
  if (tg.t === 'set') {
    const it = S.active.items[tg.i], s = it.sets[tg.j], ap = $('#sapply'), apply = ap ? ap.checked : false;
    s[tg.f] = v;
    if (apply) it.sets.forEach((x, k) => { if (k > tg.j && !x.done && (tg.f === 'r' || x.tag === s.tag)) x[tg.f] = v; });
  } else if (tg.t === 'item') { const it = S.active.items[tg.i]; it.val = v; it.edited = true; }
  else if (tg.t === 'bw') { ui.bwDraft = v; ui.sheet = null; ACT.bwlog(); return; }
  else if (tg.t === 'e1rm') { S.e1rm[tg.l] = v; S.e1rmEst[tg.l] = false; S.hist[tg.l].push({ d: today(), v }); }
  else if (tg.t === 'bar') S.settings[tg.k] = v;
  else if (tg.t === 'adj') S.settings[tg.k] = v;
  else if (tg.t === 'test') { (S.tests[tg.k] = S.tests[tg.k] || []).push({ d: today(), v }); toast(`${TESTS[tg.k].name} logged.`); }
  ui.sheet = null; save(); render();
}
function parseTyped(raw, fmt) {
  raw = String(raw).trim().replace(',', '.');
  if (fmt === 'time' && raw.includes(':')) { const [m, s] = raw.split(':'); return (+m) * 60 + (+s || 0); }
  return parseFloat(raw.replace('+', ''));
}
async function exportData() {
  const json = JSON.stringify(S), name = `breakdown-backup-${today()}.json`;
  try { const f = new File([json], name, { type: 'application/json' }); if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: 'Breakdown backup' }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  try { const url = URL.createObjectURL(new Blob([json], { type: 'application/json' })); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); toast('Backup saved.'); } catch (e) { copyData(); }
}
async function copyData() { try { await navigator.clipboard.writeText(JSON.stringify(S)); toast('Backup copied. Paste it into Notes to keep it safe.'); } catch (e) { toast('Copy did not work here. Use Share backup instead.'); } }
function doImport(text) {
  try { const o = JSON.parse(text); if (!o || o.v !== 1 || !o.settings || !o.e1rm) throw 0; S = hydrate(o); ui.sheet = null; ui.view = S.active ? 'session' : 'tabs'; save(); render(); toast('Backup restored.'); }

}

  pick(o) { ui.pick = o.v === nextSid() ? null : o.v; render(); },
  feel(o) { ui.feel = o.v; render(); },
  start(o) { startSession(o.v); },
  resume() { ui.view = 'session'; ui.lastKey = null; requestWake(); render(); },
  minimize() { ui.view = 'tabs'; ui.tab = 'today'; ui.lastKey = null; render(); },
  tick(o) {
    const it = S.active.items[o.i], s = it.sets[o.j]; s.done = !s.done;
    if (s.done) { if (it.rest > 0) startRest(it.rest, it.g && it.g.length > 1 ? nextInGroup(o.i) : nextLabel(o.i)); else toast('Now: ' + nextInGroup(o.i)); }
    save(); render();
  },
  toggle(o) { const it = S.active.items[o.i]; if (it.k === 'test' && !it.done && !it.edited && latest(it.key) == null) { ACT.editv(o); return; } it.done = !it.done; if (it.done && it.k === 'test') it.edited = true; save(); render(); },
  logall(o) { const it = S.active.items[o.i]; it.sets.forEach(s => { s.done = true; }); save(); render(); },
  effort(o) { S.active.items[o.i].effort = o.v; save(); render(); },
  edit(o) { editSet(o.i, o.j, o.f); },
  editv(o) { const it = S.active.items[o.i], k = it.key || it.metric, t = TESTS[k]; openNum({ title: t.name, sub: t.note, val: it.val, step: t.step, big: t.big, min: 0, fmt: t.unit === 'time' ? 'time' : t.unit === 's' ? 's' : 'n', target: { t: 'item', i: o.i } }); },
  logtest(o) { const t = TESTS[o.v]; openNum({ title: t.name, sub: t.note, val: latest(o.v) ?? t.def, step: t.step, big: t.big, min: 0, fmt: t.unit === 'time' ? 'time' : t.unit === 's' ? 's' : 'n', target: { t: 'test', k: o.v } }); },
  swap(o) { ui.sheet = { kind: 'swap', i: o.i }; render(); },
  doswap(o) {
    const it = S.active.items[ui.sheet.i];
    if (it.k === 'main') { if (o.v === it.base) delete S.swaps[it.lift]; else S.swaps[it.lift] = o.v; it.name = o.v; }
    else {
      if (o.v === it.base) delete S.swaps[it.id]; else S.swaps[it.id] = o.v;
      const fresh = materialize(S.active.sid, S.active.feel, S.active.w).find(x => x.id === it.id && x.g === it.g);
      if (fresh) { const done = it.sets.filter(s => s.done).length; S.active.items[ui.sheet.i] = done ? { ...fresh, sets: fresh.sets.map((s, k) => it.sets[k] && it.sets[k].done ? it.sets[k] : s) } : fresh; }
    }
    ui.sheet = null; save(); render();
  },
  timer(o) { startTimer(o.i); },
  tpause() { const T = ui.timer; if (T.paused) { T.segEnd = Date.now() + T.left; T.paused = false; } else { T.left = T.segEnd - Date.now(); T.paused = true; } render(); },
  tnext() { const T = ui.timer; if (T.paused) { T.paused = false; } T.segEnd = Date.now(); timerTick(); },
  tprev() { const T = ui.timer; T.idx = Math.max(0, T.idx - 1); T.segEnd = Date.now() + T.plan[T.idx].s * 1000; T.paused = false; T.last = -1; render(); },
  tclose() { const T = ui.timer; ui.timer = null; if (!S.active) releaseWake(); render(); if (T && T.done && T.metric) toast('Enter your result on the card.'); },
  stopwatch(o) { ui.sw = { i: o.i, acc: 0, running: false, t0: 0 }; requestWake(); render(); },
  swstart() { const W2 = ui.sw; W2.t0 = Date.now(); W2.running = true; beepSeq('go'); render(); },
  swstop() { const W2 = ui.sw; W2.acc += (Date.now() - W2.t0) / 1000; W2.running = false; beepSeq('rest'); render(); },
  swreset() { ui.sw = { ...ui.sw, acc: 0, running: false }; render(); },
  swsave() { const W2 = ui.sw, it = S.active.items[W2.i]; it.val = Math.round(W2.acc); it.edited = true; it.done = true; ui.sw = null; save(); render(); toast('Bronco time saved. Your running targets update when you finish.'); },
  swclose() { ui.sw = null; render(); },
  rest(o) { const A = S.active; if (!A.restEnd) return; if (o.v === 'skip') A.restEnd = null; else { A.restEnd += (+o.v) * 1000; A.restTotal = Math.max(A.restTotal, (A.restEnd - Date.now()) / 1000); A.restBeeped = false; } save(); updateRestBar(); },
  finish() { ui.sheet = { kind: 'finish' }; render(); },
  discard() { ui.sheet = { kind: 'finish', confirm: true }; render(); },
  discard2() { S.active = null; ui.sheet = null; ui.view = 'tabs'; releaseWake(); save(); render(); toast('Session discarded.'); },
  savesession() { finishSession(); },
  closesheet() { ui.sheet = null; render(); },
  stype() { const v = ui.sheet.val; ui.sheet.typing = true; ui.sheet.val = v; render(); },
  sstep(o) { const sh = ui.sheet; if (sh.typing) { const p = parseTyped($('#sinput').value, sh.fmt); if (!isNaN(p)) sh.val = p; sh.typing = false; } const ap = $('#sapply'); if (ap) sh.apply = ap.checked; sh.val = Math.max(sh.min ?? 0, Math.round((sh.val + (+o.v)) * 100) / 100); render(); },
  ssave() { const sh = ui.sheet; let v = sh.val; if (sh.typing) { const p = parseTyped($('#sinput').value, sh.fmt); if (isNaN(p)) { toast('That is not a number. Try again.'); return; } v = p; } applyNum(Math.max(sh.min ?? 0, v)); },
  bw(o) { const tr = trendSeries(), last = tr[tr.length - 1]; ui.bwDraft = Math.round(((ui.bwDraft ?? (last ? last.kg : 84)) + (+o.v)) * 10) / 10; render(); },
  bwsheet() { const tr = trendSeries(), last = tr[tr.length - 1]; openNum({ title: 'Bodyweight', sub: 'Morning, after the toilet, before food.', val: ui.bwDraft ?? (last ? last.kg : 84), step: .1, big: 1, min: 30, fmt: 'n', target: { t: 'bw' } }); },
  bwlog() { const tr = trendSeries(), last = tr[tr.length - 1], v = ui.bwDraft ?? (last ? last.kg : 84), d = today(); S.bw = S.bw.filter(e => e.d !== d); S.bw.push({ d, kg: Math.round(v * 10) / 10 }); ui.bwDraft = null; save(); render(); toast(`${v.toFixed(1)} kg logged.`); },
  daytype(o) { ui.dayType = o.v; render(); },
  checkin(o) { const ci = checkinDue(); if (!ci) return; if (o.v === '1' && ci.act) S.settings[ci.act.k] += ci.act.v; S.checkins.push({ d: today(), rate: ci.rate }); save(); render(); toast(o.v === '1' ? 'Calories adjusted.' : 'Check-in done.'); },
  mode(o) { S.settings.mode = o.v; ui.pick = null; save(); render(); },
  week(o) { S.settings.week = Math.min(12, Math.max(1, S.settings.week + (+o.v))); save(); render(); },
  e1rm(o) { openNum({ title: `${LIFTS[o.v].name} max`, sub: o.v === 'chin' ? 'Estimated 1-rep max including bodyweight.' : 'Estimated 1-rep max. Every load in the program comes from this.', val: S.e1rm[o.v], step: 2.5, big: 10, min: 20, fmt: 'kg', target: { t: 'e1rm', l: o.v } }); },
  bar(o) { openNum({ title: o.v === 'bar' ? 'Barbell weight' : 'Trap bar weight', val: S.settings[o.v], step: 2.5, big: 5, min: 0, fmt: 'kg', target: { t: 'bar', k: o.v } }); },
  adj(o) { openNum({ title: o.v === 'adjLift' ? 'Training day adjustment' : 'Rest day adjustment', sub: 'Added to or taken from the base calories.', val: S.settings[o.v], step: 50, big: 200, min: -1000, fmt: 'n', target: { t: 'adj', k: o.v } }); },
  sound() { S.settings.sound = !S.settings.sound; save(); render(); if (S.settings.sound) beep(); },
  export() { exportData(); },
  copy() { copyData(); },
  import() { ui.sheet = { kind: 'imp' }; render(); },
  async doimport() { const f = $('#impfile'), t = $('#imptext'); if (f && f.files && f.files[0]) doImport(await f.files[0].text()); else if (t && t.value.trim()) doImport(t.value.trim()); else toast('Pick a file or paste the backup text first.'); },
  reset() { ui.sheet = { kind: 'reset' }; render(); },
  reset2() { S = defState(); ui.sheet = null; ui.view = 'tabs'; ui.tab = 'today'; save(); render(); toast('All data wiped.'); },
  psess(o) { ui.pSid = o.v; render(); },
  pweek(o) { ui.pWeek = Math.min(12, Math.max(1, (ui.pWeek || S.settings.week) + (+o.v))); render(); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  if (b.dataset.a === 'noop') { if (e.target.closest('[data-a]') === b) return; }
  unlockAudio();
  const fn = ACT[b.dataset.a]; if (!fn) return;
  if (b.dataset.a === 'closesheet' && e.target !== b && !e.target.closest('button[data-a="closesheet"]')) return;
  fn({ v: b.dataset.v, i: +b.dataset.i, j: +b.dataset.j, f: b.dataset.f });
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && $('#sinput')) ACT.ssave(); if (e.key === 'Escape' && ui.sheet) ACT.closesheet(); });
setInterval(() => {
  if (S.active) { const el = $('#elapsed'); if (el) el.textContent = fmtT((Date.now() - S.active.start) / 1000); updateRestBar(); }
  if (ui.timer) timerTick();
  if (ui.sw) swTick();
}, 250);
if (S.active) requestWake();
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
